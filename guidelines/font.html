<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { margin: 0; padding: 24px; background: #fff; font-family: var(--font-family); }
    .big { font-size: 40px; letter-spacing: -0.02em; line-height: 1.05; }
    .w5 { font-weight: 500; } .w7 { font-weight: 700; } .w9 { font-weight: 900; }
    .lbl { font-size: 12px; color: #999; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="big"><span class="w5">Aa</span> <span class="w7">Aa</span> <span class="w9">Aa</span> &nbsp;<span class="w5" style="font-size:28px">abcdefg · 0123456789</span></div>
  <div class="lbl">Figtree — Medium / Bold / Black</div>
</body>
</html>
